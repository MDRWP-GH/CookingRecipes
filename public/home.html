<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Note - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="home.html" class="nav-brand">
                <i class='bx bxs-chef-hat'></i> Cooking Note
            </a>
        </div>

        <div class="nav-right">
            <div id="guest-nav">
                <a href="Login.html" class="btn-primary">เข้าสู่ระบบ / สมัครสมาชิก</a>
            </div>

            <div id="user-nav" class="hidden">
                <button class="btn-create" onclick="window.location.href='create-recipe.html'">
                    <i class='bx bx-plus'></i> <span>เขียนสูตร</span>
                </button>

                <div class="profile-container">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic" id="profile-toggle">

                    <div class="dropdown-menu hidden" id="user-dropdown">
                        <div class="dropdown-header">
                            <img src="https://via.placeholder.com/50" class="dd-avatar">
                            <div class="dd-info">
                                <span class="dd-name">ชื่อผู้ใช้</span>
                                <span class="dd-username">@username</span>
                            </div>
                        </div>
                        <ul class="dropdown-list">
                            <li><a href="profile.html"><i class='bx bx-user'></i> โปรไฟล์</a></li>
                            <li><a href="favorites.html"><i class='bx bx-bookmark'></i> รายการโปรด</a></li>
                            <li><a href="notifications.html"><i class='bx bx-bell'></i> การแจ้งเตือน</a></li>
                            <li><a href="settings.html"><i class='bx bx-cog'></i> ตั้งค่า</a></li>
                        </ul>
                        <div class="dropdown-footer">
                            <button class="btn-logout" id="logout-btn">ออกจากระบบ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-content">
            <h1>Discover Delicious Thai Recipes</h1>
            <p>Explore authentic Thai cuisine, share your own recipes, and connect with food lovers around the world</p>

            <div class="main-search-box">
                <i class='bx bx-search'></i>
                <input type="text" id="main-search-input" placeholder="ค้นหาชื่อเมนูหรือวัตถุดิบ">
                <button id="main-search-btn" type="button">search</button>
            </div>
        </div>
    </header>

    <div class="container main-content">
        <div class="filter-bar">
            <div class="select-group">
                <select class="custom-select" id="category-filter">
                    <option value="" selected>ประเภทเมนู</option>
                    <option value="tom">ต้ม</option>
                    <option value="pad">ผัด</option>
                    <option value="gang">แกง</option>
                    <option value="tod">ทอด</option>
                </select>
                <i class='bx bx-chevron-down select-icon'></i>
            </div>

            <div class="select-group">
                <select class="custom-select" id="difficulty-filter">
                    <option value="" selected>วิธีการทำ</option>
                    <option value="easy">ง่าย</option>
                    <option value="medium">ปานกลาง</option>
                    <option value="hard">ยาก</option>
                </select>
                <i class='bx bx-chevron-down select-icon'></i>
            </div>

            <button class="btn-filter-search" id="filter-search-btn" type="button">search</button>
        </div>

        <div class="recipe-grid" id="recipe-grid"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="js/nav-script.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
