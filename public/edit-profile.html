<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Note - Edit Profile</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/edit-profile.style.css">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="home.html" class="nav-brand">
                <i class='bx bxs-chef-hat'></i> Cooking Note
            </a>
        </div>

        <div class="nav-right">
            <div id="guest-nav">
                <a href="Login.html" class="btn-primary">เข้าสู่ระบบ / สมัครสมาชิก</a>
            </div>

            <div id="user-nav" class="hidden">
                <button class="btn-create" onclick="window.location.href='create-recipe.html'">
                    <i class='bx bx-plus'></i> <span>เขียนสูตร</span>
                </button>
                
                <div class="profile-container">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic" id="profile-toggle">
                    
                    <div class="dropdown-menu hidden" id="user-dropdown">
                        <div class="dropdown-header">
                            <img src="https://via.placeholder.com/50" class="dd-avatar">
                            <div class="dd-info">
                                <span class="dd-name">ชื่อผู้ใช้</span>
                                <span class="dd-username">@username</span>
                            </div>
                        </div>
                        <ul class="dropdown-list">
                            <li><a href="profile.html"><i class='bx bx-user'></i> โปรไฟล์</a></li>
                            <li><a href="favorites.html"><i class='bx bx-bookmark'></i> รายการโปรด</a></li>
                            <li><a href="notifications.html"><i class='bx bx-bell'></i> การแจ้งเตือน</a></li>
                            <li><a href="settings.html"><i class='bx bx-cog'></i> ตั้งค่า</a></li>
                        </ul>
                        <div class="dropdown-footer">
                            <button class="btn-logout" id="logout-btn">ออกจากระบบ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="edit-wrapper">
        <div class="edit-card">
            
            <div class="profile-img-container">
                <div class="img-preview"></div>
                </div>

            <form id="editProfileForm">
                <div class="form-group">
                    <label>ชื่อผู้ใช้</label>
                    <input type="text" id="username" value="ใจดี" required>
                </div>

                <div class="form-group">
                    <label>ID</label>
                    <input type="text" id="userId" value="@cook_12345" readonly style="background-color: #f9f9f9; color: #666;">
                    </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" value="123@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>คำอธิบาย</label>
                    <textarea id="bio" rows="4"></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-update">อัพเดท</button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='profile.html'">ยกเลิก</button>
                </div>
            </form>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="js/nav-script.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
        // 1. ดึง ID และข้อมูลจาก LocalStorage (ที่ได้มาตอน Login)
        const userId = localStorage.getItem('userId'); 
        const currentUsername = localStorage.getItem('username'); 
        
        // ถ้าไม่มี userId แปลว่ายังไม่ได้ Login -> ดีดกลับไปหน้า Login
        if(!userId) {
            alert('กรุณาเข้าสู่ระบบก่อนแก้ไขข้อมูล');
            window.location.href = 'Login.html';
            return;
        }

        // แสดง ID และ ชื่อเดิม (ถ้ามี) เพื่อให้ User รู้ว่ากำลังแก้ของใคร
        document.getElementById('userId').value = '@user_' + userId;
        if(currentUsername) {
            document.getElementById('username').value = currentUsername;
        }

        // 2. ส่วนการกดปุ่ม "อัพเดท" (Update)
        const form = document.getElementById('editProfileForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // ห้ามรีเฟรชหน้า
            
            // ล็อกปุ่มกันกดรัวๆ
            const btn = document.querySelector('.btn-update');
            const originalText = btn.innerText;
            btn.innerText = 'กำลังบันทึก...';
            btn.disabled = true;

            // เตรียมข้อมูลที่จะส่ง
            const data = {
                id: userId,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                bio: document.getElementById('bio').value
            };

            try {
                // ยิงไปหา Server (Backend)
                const res = await fetch('/api/user/update', {
                    method: 'PUT', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    // ถ้าสำเร็จ
                    alert('บันทึกข้อมูลเรียบร้อย!');
                    // อัปเดตชื่อใหม่ลงเครื่องด้วย (เผื่อเขาเปลี่ยนชื่อ)
                    localStorage.setItem('username', result.username); 
                    window.location.href = 'profile.html'; // กลับไปหน้าโปรไฟล์
                } else {
                    // ถ้าไม่สำเร็จ (เช่น ชื่อซ้ำ)
                    alert(result.msg);
                }

            } catch (err) {
                console.error('Error:', err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับ Server');
            } finally {
                // ปลดล็อกปุ่ม ไม่ว่าจะผ่านหรือไม่ผ่าน
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    });
    </script>
</body>
</html>
